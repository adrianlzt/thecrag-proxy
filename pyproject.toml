[project]
name = "thecrag-proxy"
version = "0.1.0"
description = "Proxy de theCrag con los grados en escala francesa"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28",
    "starlette>=0.46",
    "uvicorn>=0.34",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning:starlette.testclient"]
